/* ═══════════ 🦺 CAUSERIES SÉCURITÉ — Styles (mobile, tablette, PC) ═══════════ */
:root{
  --p:#F26B1D; --p2:#FF8A3D; --pl:#FFF1E7;
  --navy:#1B2A41; --navy2:#2C3E5C; --y:#FFC72C; --g:#1E9E5A; --gl:#E6F6EE;
  --r:#D7263D; --rl:#FDECEE; --b:#2E86DE; --bl:#EAF3FC; --v:#7B4FD6; --vl:#F2ECFC;
  --bg:#F4F5F7; --card:#FFFFFF; --t:#1B2A41; --m:#6B7280; --line:#E5E7EB;
  --rad:16px; --sh:0 2px 10px rgba(27,42,65,.08); --sh2:0 8px 28px rgba(27,42,65,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--t);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:16px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2}
h1{font-size:1.6rem;font-weight:900} h2{font-size:1.3rem;font-weight:800} h3{font-size:1.1rem;font-weight:800}
a{color:var(--b)}
.hidden{display:none!important}
.muted{color:var(--m)} .small{font-size:.85rem} .center{text-align:center} .right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1}
.mt{margin-top:14px}.mb{margin-bottom:14px}.mt2{margin-top:24px}

/* ─── Barre du haut ─── */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.top .back{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.top .ttl{flex:1;font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand{display:flex;align-items:center;gap:8px}
.top .brand img{height:30px;border-radius:6px;background:#fff}
.top .me{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.85rem;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.wrap.narrow{max-width:640px}

/* ─── Cartes & tuiles ─── */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card.click{cursor:pointer;transition:transform .12s, box-shadow .12s}
.card.click:active{transform:scale(.985)}
@media(hover:hover){.card.click:hover{box-shadow:var(--sh2)}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;border-radius:var(--rad);padding:16px 14px;color:#fff;cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--sh);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:2.1rem;position:absolute;top:12px;left:14px}
.tile b{font-size:1.02rem;font-weight:900;line-height:1.15} .tile span{font-size:.8rem;opacity:.92;margin-top:3px}
.tile .badge{position:absolute;top:10px;right:10px;background:var(--y);color:var(--navy);font-weight:900;border-radius:20px;padding:2px 10px}
.t-orange{background:linear-gradient(135deg,var(--p),var(--p2))} .t-navy{background:linear-gradient(135deg,var(--navy),var(--navy2))}
.t-green{background:linear-gradient(135deg,#178a4d,#26b469)} .t-yellow{background:linear-gradient(135deg,#e7a800,#ffc72c);color:var(--navy)}
.t-blue{background:linear-gradient(135deg,#1f6fbf,#3d97ea)} .t-grey{background:linear-gradient(135deg,#4b5563,#6b7280)}
.t-brown{background:linear-gradient(135deg,#6d4c41,#8d6e63)} .t-dark{background:linear-gradient(135deg,#111827,#374151)}
.t-violet{background:linear-gradient(135deg,#5b34b5,#7b4fd6)}

.hello{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--rad);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hello:after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:repeating-linear-gradient(45deg,var(--y) 0 12px,var(--navy) 12px 24px);opacity:.25}
.hello h1{margin:0;color:#fff}.hello .muted{color:#cfd8e3}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat-c{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh)} .stat-c b{font-size:1.6rem;font-weight:900;display:block;color:var(--navy)} .stat-c span{font-size:.8rem;color:var(--m)}

/* ─── Boutons & champs ─── */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:#E5E7EB;color:var(--t);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;transition:transform .1s, opacity .1s;text-decoration:none}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--p);color:#fff} .btn.navy{background:var(--navy);color:#fff} .btn.green{background:var(--g);color:#fff}
.btn.red{background:var(--r);color:#fff} .btn.ghost{background:transparent;border:2px solid var(--line)} .btn.link{background:none;color:var(--b);min-height:auto;padding:6px}
.btn.big{width:100%;font-size:1.1rem;padding:16px;min-height:56px} .btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
label{display:block;font-weight:800;font-size:.9rem;margin:12px 0 6px}
input[type=text],input[type=email],input[type=number],input:not([type]),select,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--t);outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{min-height:110px;resize:vertical;line-height:1.4}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:340px}
.otp{font-size:2rem!important;letter-spacing:.5em;text-align:center;font-weight:900}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:12px 0;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--p)}

/* ─── Puces ─── */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;background:#EEF0F3;font-size:.8rem;font-weight:700;margin:2px 4px 2px 0;white-space:nowrap}
.chip.p{background:var(--pl);color:#a3420b}.chip.g{background:var(--gl);color:#11683b}.chip.r{background:var(--rl);color:#a1182a}.chip.b{background:var(--bl);color:#185e9e}.chip.v{background:var(--vl);color:#5b34b5}.chip.y{background:#FFF6D6;color:#7a5a00}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px}
.chips-sel .chip{cursor:pointer;border:2px solid transparent;padding:7px 12px;font-size:.85rem}
.chips-sel .chip.on{background:var(--navy);color:#fff}

/* ─── Liste ─── */
.li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#fff;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer}
.li .em{font-size:1.8rem;width:46px;height:46px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:none}
.li .tx{flex:1;min-width:0} .li .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .li .tx span{font-size:.82rem;color:var(--m)}
.empty{text-align:center;color:var(--m);padding:30px 10px}
.empty div{font-size:3rem}

/* ─── Onglets ─── */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:var(--sh);color:var(--m)}
.tab.on{background:var(--navy);color:#fff}

/* ─── Connexion ─── */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 55%,var(--p) 140%)}
.login-card{background:#fff;border-radius:22px;padding:26px 22px;max-width:420px;width:100%;box-shadow:var(--sh2)}
.hero-emoji{font-size:4rem;text-align:center}
.stripe{height:10px;border-radius:6px;background:repeating-linear-gradient(45deg,var(--y) 0 14px,var(--navy) 14px 28px);margin:14px 0}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--m);font-weight:700}
.splash-emoji{font-size:4rem;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-10px)}}

/* ─── Lecteur de fiches ─── */
.reader{display:flex;flex-direction:column;gap:12px}
.rprog{display:flex;gap:4px}
.rprog span{flex:1;height:6px;border-radius:4px;background:#dde1e7;transition:background .3s}
.rprog span.on{background:var(--p)}
.rcard{background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:22px 20px;min-height:52vh;font-size:1.08rem}
.rcard h2{font-size:1.45rem;color:var(--navy);margin-bottom:14px}
.rcard p{margin:.55em 0}
.rcard ul{padding-left:1.2em;margin:.5em 0}.rcard li{margin:.35em 0}
.present .rcard{font-size:1.45rem;min-height:62vh;padding:34px}.present .rcard h2{font-size:2rem}
.anim{animation:pop .28s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.rnav{display:flex;gap:10px;align-items:center}.rnav .btn{flex:1}.rnav .cnt{font-weight:800;color:var(--m);min-width:54px;text-align:center}
.box{border-radius:14px;padding:12px 14px;margin:12px 0;border-left:6px solid}
.box-h{font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.box.danger{background:var(--rl);border-color:var(--r)}.box.danger .box-h{color:var(--r)}
.box.good{background:var(--gl);border-color:var(--g)}.box.good .box-h{color:var(--g)}
.box.info{background:var(--bl);border-color:var(--b)}.box.info .box-h{color:var(--b)}
.box.talk{background:var(--vl);border-color:var(--v)}.box.talk .box-h{color:var(--v)}
.statbig{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:14px 16px;margin:12px 0}
.statbig .n{font-size:2.2rem;font-weight:900;color:var(--y);white-space:nowrap}
.statbig .t{font-weight:700}
.do{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin:6px 0;font-weight:600}
.do span{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:.9rem}
.do.ok{background:#F1FAF5}.do.ok span{background:var(--g)} .do.ko{background:#FDF3F4}.do.ko span{background:var(--r)}

/* ─── Quiz ─── */
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:8px}
.qpts{background:var(--navy);color:var(--y);padding:4px 12px;border-radius:20px}
.streak{color:var(--p)}
.tbar{height:10px;background:#e3e6ea;border-radius:6px;overflow:hidden;margin-bottom:12px}
.tbar div{height:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--r));transition:width .1s linear}
.qcard{background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:20px}
.qemoji{font-size:3rem;text-align:center}
.qtype{text-align:center;font-weight:900;font-size:.78rem;letter-spacing:.08em;color:var(--p);text-transform:uppercase}
.qtext{font-size:1.22rem;font-weight:800;text-align:center;margin:8px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:3px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:700;cursor:pointer;font-size:1.02rem;min-height:58px;transition:all .15s}
.opt .l{flex:none;width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--g);background:var(--gl)}.opt.ok .l{background:var(--g)}
.opt.ko{border-color:var(--r);background:var(--rl)}.opt.ko .l{background:var(--r)}
.opt.dim{opacity:.5}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{flex-direction:column;justify-content:center;font-size:1.2rem;min-height:110px;text-align:center}
.vf .opt .big{font-size:2.4rem}
.ord-pool,.ord-ans{display:grid;gap:8px;min-height:40px}
.ord-ans{background:#F8F9FB;border:2px dashed #cfd5dd;border-radius:14px;padding:10px;margin-bottom:12px}
.ord-ans .opt .l{background:var(--p)}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;animation:pop .25s}
.fb.ok{background:var(--gl);border:2px solid var(--g)}.fb.ko{background:var(--rl);border:2px solid var(--r)}
.fb h3{margin:0 0 4px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ─── Résultat ─── */
.res{text-align:center;padding:10px}
.res .stars{font-size:3rem;letter-spacing:6px}
.res .score{font-size:4rem;font-weight:900;color:var(--navy);line-height:1}
.res .xp{display:inline-block;background:var(--navy);color:var(--y);padding:6px 16px;border-radius:20px;font-weight:900;margin:10px 0}
.badge-big{width:140px;height:140px;margin:10px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:4.5rem;background:radial-gradient(circle,#fff 55%,var(--y) 56%,var(--y) 66%,var(--p) 67%);box-shadow:var(--sh2);animation:pop .5s}

/* ─── Signature ─── */
.sigwrap{position:relative;border:3px dashed #c5ccd6;border-radius:14px;background:#fff;touch-action:none}
.sigwrap canvas{display:block;width:100%;aspect-ratio:18/7;touch-action:none;border-radius:12px;cursor:crosshair}
.sigwrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b6bec9;font-weight:800;pointer-events:none}
.sigwrap .clr{position:absolute;top:6px;right:6px}
.sigimg{height:46px;max-width:160px;background:#fff;border:1px solid var(--line);border-radius:6px}

/* ─── Causerie en direct ─── */
.codebox{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--rad);padding:14px;margin-bottom:14px;flex-wrap:wrap}
.codebox .code{font-size:2.3rem;font-weight:900;letter-spacing:.18em;color:var(--y)}
.codebox img{width:96px;height:96px;background:#fff;border-radius:10px;padding:4px}
.chrono{font-weight:900;font-size:1.2rem;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:12px}
.chrono.late{background:var(--r)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.step{border:0;background:#fff;border-radius:12px;padding:10px 4px;font-weight:800;font-size:.8rem;box-shadow:var(--sh);cursor:pointer;color:var(--m)}
.step i{display:block;font-style:normal;font-size:1.4rem}
.step.on{background:var(--p);color:#fff}

/* ─── Météo & suggestions ─── */
.meteo{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1f6fbf,#3d97ea);color:#fff;border-radius:var(--rad);padding:14px 16px;margin-bottom:14px}
.meteo .ic{font-size:3rem}.meteo b{font-size:1.6rem}
.sugg{border:3px solid transparent}
.sugg.sel{border-color:var(--p);background:var(--pl)}
.reco{background:var(--y);color:var(--navy);font-weight:900;font-size:.72rem;padding:2px 8px;border-radius:8px;text-transform:uppercase}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode .card{margin:0;text-align:center;cursor:pointer;border:3px solid transparent}
.mode .card.sel{border-color:var(--p);background:var(--pl)}
.mode .card div{font-size:2.2rem}

/* ─── Tableaux ─── */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:.78rem;text-transform:uppercase;color:var(--m)}
.scroll-x{overflow-x:auto}

/* ─── Éditeur de quiz ─── */
.qed{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#FCFCFD}
.qed .hd{display:flex;gap:6px;align-items:center;justify-content:space-between;font-weight:900}
.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.help{font-size:.82rem;background:#F8F9FB;border-radius:10px;padding:10px;line-height:1.6}
.help code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;cursor:pointer}

/* ─── Modale, toast, loader ─── */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.modal{align-items:center}}
.modal-in{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;animation:up .25s ease-out}
@media(min-width:720px){.modal-in{border-radius:22px}}
.modal-in.wide{max-width:900px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--sh2);max-width:92vw;animation:up .2s}
.toast.err{background:var(--r)}.toast.ok{background:var(--g)}.toast.warn{background:#b7791f}
.loader{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid #e5e7eb;border-top-color:var(--p);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

/* ─── Barre d'action collante (mobile) ─── */
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 max(10px,env(safe-area-inset-bottom));display:flex;gap:10px}
.sticky-actions .btn{flex:1}
@media print{.top,.sticky-actions,.btn{display:none!important}}

/* ─── v2 : affiche, quiz façon Kahoot, suivi live ─── */
.poster .rcard{border:8px solid #1B2A41;border-radius:14px;position:relative;padding-top:34px}
.poster .rcard:before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(45deg,#FFC72C 0 14px,#1B2A41 14px 28px)}
.poster .rcard h2{background:#1B2A41;color:#fff;text-transform:uppercase;padding:10px 14px;border-radius:8px;font-size:1.15rem;letter-spacing:.02em}
.pages img{width:100%;display:block;border-radius:12px;box-shadow:var(--sh2);margin-bottom:14px;background:#fff}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumb{position:relative}.thumb img{height:150px;border-radius:8px;box-shadow:var(--sh)}.thumb .btn{position:absolute;top:4px;right:4px;min-height:30px;padding:2px 8px}
.kcount{width:84px;height:84px;margin:6px auto 10px;border-radius:50%;background:var(--navy);color:var(--y);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;transition:background .2s}
.kcount.hot{background:var(--r);color:#fff;animation:shake .4s}
.kq{background:#fff;border-radius:18px;box-shadow:var(--sh2);padding:18px;font-size:1.25rem;font-weight:900;text-align:center;margin-bottom:14px}
.kq.big{font-size:1.9rem;padding:28px}
.kopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kbtn{border:0;border-radius:16px;color:#fff;font-weight:800;font-size:1.02rem;min-height:110px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .1s,opacity .2s;font-family:inherit}
.kbtn:active{transform:scale(.97)}.kbtn.tall{min-height:150px;font-size:1.5rem}
.kbtn.dim{opacity:.25}.kbtn.right{outline:5px solid #FFC72C;outline-offset:2px}
@media(min-width:900px){.kbtn{min-height:130px;font-size:1.2rem}}
.lrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrk{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--y);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem;flex:none}
.lsc{min-width:56px;text-align:right}
.lbar{height:10px;background:#E5E7EB;border-radius:6px;overflow:hidden;margin-top:4px}.lbar div{height:100%;background:var(--p);border-radius:6px;transition:width .4s}
.mgrid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:720px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mgrid .card{margin:0}.mgrid ul{padding-left:1.1em;margin:.5em 0 0}
.mode .card div{font-size:2.2rem}

/* ═════════ ADMIN PRO + STUDIO ═════════ */
body.pro{font-family:Inter,system-ui,sans-serif;background:#F3F4F6;color:#111827;font-size:14px}
body.pro button,body.pro input,body.pro select,body.pro textarea{font-family:Inter,system-ui,sans-serif}
.p-app{display:flex;min-height:100vh}
.p-side{width:232px;background:var(--ps,#111827);color:#E5E7EB;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;box-sizing:border-box;flex:none}
.p-brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}.p-brand b{display:block;font-size:14px}.p-brand small{color:#9CA3AF;font-size:12px}
.p-side .p-brand b{color:#fff}
.p-logo{width:38px;height:38px;border-radius:10px;background:#FFFFFF;color:#D7263D;display:flex;align-items:center;justify-content:center;flex:none}
.p-nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:#D1D5DB;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.p-nav:hover{background:#1F2937;color:#fff}.p-nav.on{background:var(--pa,#EA580C);color:#fff}
.p-side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.p-main{flex:1;min-width:0;display:flex;flex-direction:column}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 28px;background:#fff;border-bottom:1px solid #E5E7EB;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.p-head h1{font-size:20px;font-weight:700;margin:0}
.p-actions,.p-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-body{padding:24px 28px 60px;max-width:1280px;width:100%;box-sizing:border-box}
.p-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px solid #D1D5DB;background:#fff;color:#111827;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.p-btn:hover{background:#F9FAFB}.p-btn.pri{background:var(--pa,#EA580C);border-color:var(--pa,#EA580C);color:#fff}.p-btn.pri:hover{background:#C2410C}
.p-btn.ghost{border-color:transparent;background:transparent}.p-btn.danger{color:#B91C1C;border-color:#FCA5A5}.p-btn.sm{height:30px;padding:0 10px;font-size:12px}
.p-btn.ghost-d{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.p-ibtn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #E5E7EB;background:#fff;border-radius:8px;color:#374151;cursor:pointer;flex:none}
.p-ibtn:hover{background:#F3F4F6}
.p-link{border:0;background:none;color:#2563EB;font-size:12px;cursor:pointer;padding:4px 0}
.p-card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:18px;margin-bottom:16px}
.p-card h3{font-size:15px;margin:0 0 12px}
.p-muted{color:#6B7280;font-size:12.5px}
.p-lab{display:block;font-size:12px;font-weight:600;color:#374151;margin:12px 0 6px}
.p-in{width:100%;box-sizing:border-box;border:1px solid #D1D5DB;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:#111827;min-height:38px}
.p-in:focus{outline:2px solid #FDBA74;border-color:var(--pa,#EA580C)}
textarea.p-in{resize:vertical;line-height:1.45}
.p-check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px;cursor:pointer}
.p-check input{width:18px;height:18px;accent-color:var(--pa,#EA580C)}
.p-grid2{display:grid;grid-template-columns:1fr;gap:0 16px}@media(min-width:900px){.p-grid2{grid-template-columns:1fr 1fr}}
.p-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.p-empty{text-align:center;color:#6B7280;padding:60px 20px;border:2px dashed #D1D5DB;border-radius:12px;background:#fff;line-height:2}
.p-tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:#F3F4F6;color:#374151;white-space:nowrap}.p-tag.ok{background:#DCFCE7;color:#166534}
.p-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.p-doc{background:#fff;border:1px solid #E5E7EB;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.p-thumb{aspect-ratio:210/297;background:#F3F4F6;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9CA3AF;font-size:13px;border-bottom:1px solid #E5E7EB;max-height:300px}
.p-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.p-doc-b{padding:12px 14px}.p-doc-t{font-size:14px;line-height:1.3}
.p-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.p-choice button{border:1px solid #E5E7EB;background:#fff;border-radius:12px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;color:#111827}
.p-choice button:hover{border-color:var(--pa,#EA580C);background:#FFF7ED}.p-choice b{font-size:15px}.p-choice span{color:#6B7280;font-size:13px}
.p-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}

function call(action, payload, opts) {
  opts = opts || {};
  if (!opts.silent) loading(true);
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(raw => {
        if (!opts.silent) loading(false);
        let r; try { r = JSON.parse(raw); } catch (e) { r = { ok: false, error: 'Réponse illisible.' }; }
        if (r.ok) return resolve(r.data);
        if (r.error === 'ADMIN_REQUIS') { S.key = ''; LS.del('qhs_key'); adminLogin(); return reject(new Error(r.error)); }
        if (!opts.quiet) toast(r.error, 'err');
        reject(new Error(r.error));
      })
      .withFailureHandler(err => { if (!opts.silent) loading(false); if (!opts.quiet) toast('Connexion impossible : ' + ((err && err.message) || err), 'err'); reject(err); })
      .api(JSON.stringify({ action: action, payload: payload || {}, key: S.key }));
  });
}

async function joinGo() {
  const code = val('code');

    const d = await call('join', { code: code });

/* ─── Moteur de quiz façon Kahoot ─── */
function runKahoot(el, quiz, opts) {
  const base = Number(S.cfg.TEMPS_QUESTION_SEC) || 20;
  const st = { i: 0, score: 0, ok: 0, streak: 0, wrong: [] };
  let tick = null, t0 = 0, limit = 0, locked = false;
  const stop = () => { if (tick) { clearInterval(tick); tick = null; } };
  function draw() {
    locked = false;
    const q = quiz[st.i];
    limit = (q.t || base) * (opts.team ? 1.5 : 1);
    el.innerHTML = '<div class="qhead"><span>Question ' + (st.i + 1) + ' / ' + quiz.length + '</span><span class="streak">' + (st.streak >= 2 ? '🔥 x' + st.streak : '') + '</span></div>' +
      '<div class="kcount" id="kc">' + Math.ceil(limit) + '</div>' +
      (q.bonus ? '<div class="center"><span class="reco">⭐ Question bonus : la plus ratée du mois dernier (+200)</span></div>' : '') +
      '<div class="kq' + (opts.team ? ' big' : '') + '">' + esc(q.q) + '</div><div id="kb"></div><div id="kf"></div>';
    const b = el.querySelector('#kb');
    if (q.type === 'QCM') {
      b.innerHTML = '<div class="kopts">' + q.o.map((t, k) => '<button class="kbtn" style="background:' + KCOL[k][0] + '" data-i="' + k + '">' + SHAPES[KCOL[k][1]] + '<span>' + esc(t) + '</span></button>').join('') + '</div>';
      b.querySelectorAll('.kbtn').forEach(x => { x.onclick = () => answer(Number(x.dataset.i)); });
    } else if (q.type === 'VF') {
      b.innerHTML = '<div class="kopts"><button class="kbtn tall" style="background:#1E9E5A" data-v="VRAI">' + SHAPES.tri + '<span>VRAI</span></button><button class="kbtn tall" style="background:#D7263D" data-v="FAUX">' + SHAPES.dia + '<span>FAUX</span></button></div>';
      b.querySelectorAll('.kbtn').forEach(x => { x.onclick = () => answer(x.dataset.v); });
    } else {
      const mix = shuffle(q.o.map((t, k) => ({ t: t, k: k })));
      if (mix.every((m, k) => m.k === k)) mix.reverse();
      const chosen = [];
      const drawO = () => {
        b.innerHTML = '<div class="small muted center mb">Touchez les étapes dans le bon ordre (touchez-en une choisie pour l’annuler).</div><div class="ord-ans">' +
          (chosen.length ? chosen.map((m, k) => '<button class="opt" data-c="' + k + '"><span class="l">' + (k + 1) + '</span><span>' + esc(m.t) + '</span></button>').join('') : '<div class="muted small center">Votre ordre</div>') + '</div><div class="ord-pool">' +
          mix.filter(m => chosen.indexOf(m) < 0).map(m => '<button class="opt" data-p="' + m.k + '"><span class="l">•</span><span>' + esc(m.t) + '</span></button>').join('') +
          '</div><button class="btn primary block mt" id="ordok"' + (chosen.length < q.o.length ? ' disabled' : '') + '>Valider ✓</button>';
        b.querySelectorAll('[data-p]').forEach(x => { x.onclick = () => { if (locked) return; chosen.push(mix.find(m => m.k === Number(x.dataset.p))); drawO(); }; });
        b.querySelectorAll('[data-c]').forEach(x => { x.onclick = () => { if (locked) return; chosen.splice(Number(x.dataset.c), 1); drawO(); }; });
        b.querySelector('#ordok').onclick = () => answer(chosen.map(m => m.k));
      };
      drawO();
    }
    t0 = Date.now();
    stop();
    tick = setInterval(() => {
      const left = limit - (Date.now() - t0) / 1000;
      const c = el.querySelector('#kc');
      if (c) { c.textContent = Math.max(0, Math.ceil(left)); c.classList.toggle('hot', left <= 5); }
      if (left <= 0) { stop(); answer(null); }
    }, 200);
    S.timers.push(tick);
  }
  function localOk(q, a) {
    if (a === null || a === undefined) return false;
    if (q.type === 'VF') return String(a) === q.r;
    if (q.type === 'QCM') return Number(a) === Number(q.r);
    return Array.isArray(a) && a.every((v, k) => v === k);
  }
  async function answer(a) {
    if (locked) return;
    locked = true; stop();
    const q = quiz[st.i], ms = Date.now() - t0;
    el.querySelectorAll('.kbtn,.opt').forEach(x => { x.disabled = true; });
    let res;
    try {
      res = opts.preview ? null : await call('player.answer', { joueurId: S.g.j.joueurId, tok: S.g.j.tok, qid: q.id, answer: a, ms: ms }, { silent: true, quiet: true });
    } catch (e) { res = null; }
    const ok = res ? res.ok : localOk(q, a);
    const pts = res ? res.points : (ok ? Math.round(500 + 500 * (1 - ms / (limit * 1000))) : 0);
    st.score = res ? res.score : st.score + pts;
    if (ok) { st.ok++; st.streak++; } else { st.streak = 0; st.wrong.push(q); try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) { /* */ } }
    const sc = document.getElementById('kscore'); if (sc) sc.textContent = '⭐ ' + st.score;
    if (q.type === 'QCM') el.querySelectorAll('.kbtn').forEach(x => { const k = Number(x.dataset.i); x.classList.add(k === Number(q.r) ? 'right' : 'dim'); });
    if (q.type === 'VF') el.querySelectorAll('.kbtn').forEach(x => { x.classList.add(x.dataset.v === q.r ? 'right' : 'dim'); });
    if (q.type === 'ORDRE') el.querySelector('#kb').innerHTML = '<div class="small muted mb">Le bon ordre :</div><div class="ord-ans">' + q.o.map((t, k) => '<div class="opt ok"><span class="l">' + (k + 1) + '</span><span>' + esc(t) + '</span></div>').join('') + '</div>';
    const last = st.i === quiz.length - 1;
    el.querySelector('#kf').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'ko') + '"><h3>' + (ok ? pick(OK_LINES) + ' <span class="small">+' + pts + ' pts</span>' : (a === null ? '⏰ Trop tard !' : pick(KO_LINES))) + '</h3><div>' + esc(q.e) + '</div></div>' +
      '<button class="btn ' + (last ? 'green' : 'primary') + ' big mt" id="knext">' + (last ? 'Voir le classement 🏆' : 'Question suivante ▶') + '</button>';
    el.querySelector('#knext').onclick = () => { if (last) opts.onDone(st); else { st.i++; draw(); window.scrollTo(0, 0); } };
    if (ok && st.streak >= 3) confetti();
  }
  draw();
}

function kq(el) { return S.ed.quiz[Number(el.closest('.qed').dataset.i)]; }
function kSet(el, redraw) {

  if (f === 'type') { if (q.type === 'VF') { q.r = 'VRAI'; q.o = []; } if (q.type === 'QCM') { q.r = 0; q.o = ['', '', '', '']; } if (q.type === 'ORDRE') { q.r = null; q.o = ['Étape 1', 'Étape 2', 'Étape 3']; } }
  if (redraw) drawKeds();
}
function kO(el) { const q = kq(el); q.o[Number(el.dataset.o)] = el.value; }
function kR(i, k) { S.ed.quiz[i].r = k; }
function kAdd() { S.ed.quiz.push({ type: 'QCM', q: '', o: ['', '', '', ''], r: 0, e: '' }); drawKeds(); window.scrollTo(0, document.body.scrollHeight); }
function kDel(i) { S.ed.quiz.splice(i, 1); drawKeds(); }
function kMove(i, d) { const j = i + d, q = S.ed.quiz; if (j < 0 || j >= q.length) return; const t = q[i]; q[i] = q[j]; q[j] = t; drawKeds(); }
function cleanQuiz() {

    const o = (q.o || []).map(s => String(s || '').trim());
    if (q.type === 'QCM') { const keep = o.map((t, k) => ({ t: t, k: k })).filter(x => x.t); return Object.assign({}, q, { o: keep.map(x => x.t), r: Math.max(0, keep.findIndex(x => x.k === Number(q.r))) }); }
    return Object.assign({}, q, { o: o.filter(Boolean) });
  });
}

    img.onload = () => {

}

/* Mise en page automatique d'un modèle */
function seedSections(lines) {
  const secs = []; let cur = null;
  lines.forEach(l => {
    l = String(l).trim();
    if (l.indexOf('# ') === 0) { cur = { t: l.slice(2).toUpperCase(), b: [] }; secs.push(cur); return; }
    if (!cur || !l) return;
    let x = l.replace(/\*\*/g, '');
    if (x.indexOf('- ') === 0) x = '•  ' + x.slice(2);
    else if (x.indexOf('[ok] ') === 0) x = '✔  ' + x.slice(5);
    else if (x.indexOf('[ko] ') === 0) x = '✘  ' + x.slice(5);
    else if (/^(!!|>>|ii|\?\?) /.test(x)) x = x.slice(3);
    else if (x.indexOf('## ') === 0) { const p = x.slice(3).split('|'); x = p[0].trim() + ' — ' + (p[1] || '').trim(); }
    cur.b.push(x);
  });
  return secs;
}
async function buildFromSeed(seed) {
  const secs = seedSections(seed.fiches), W = PW - 2 * MG, pages = [[]];
  let y = 0;
  const head = async (annexe) => {
    const p = pages[pages.length - 1];
    const fr = await imgFromURL(stripeImg('#FFC72C', '#111827', 14)); fr.set({ left: 0, top: 0, scaleX: 0.5, scaleY: 0.5, name: 'Cadre de chantier' }); p.push(fr);
    p.push(RC({ left: MG, top: MG, width: W, height: annexe ? 40 : 74 }));
    if (annexe) p.push(TX('ANNEXE · ' + seed.titre.toUpperCase(), { left: MG + 14, top: MG + 9, width: W - 28, fontFamily: 'Oswald', fontSize: 18, fontWeight: '700', fill: '#FFFFFF' }));
    else p.push(TX('CAUSERIE SÉCURITÉ', { left: MG + 16, top: MG + 9, width: W - 32, fontFamily: 'Oswald', fontSize: 26, fontWeight: '700', fill: '#FFFFFF' }), TX(seed.titre.toUpperCase(), { left: MG + 16, top: MG + 42, width: W - 32, fontFamily: 'Oswald', fontSize: 18, fontWeight: '700', fill: '#FFC72C' }));
    y = MG + (annexe ? 52 : 88);
  };
  await head(false);
  for (let i = 0; i < secs.length; i++) {
    const s = secs[i], p = () => pages[pages.length - 1];
    const retenir = /RETENIR/.test(s.t), parole = /PAROLE/.test(s.t), first = i === 0;
    const bw = first ? W - 232 : W;
    const body = TX(s.b.join('\n'), { left: MG + (retenir ? 60 : 8), top: 0, width: (retenir ? W - 76 : bw - 16), fontSize: retenir ? 12.5 : 11, fontWeight: retenir ? '700' : '400', fill: retenir ? '#FFFFFF' : '#111827', lineHeight: 1.3 });
    const need = (retenir ? 26 : 32) + body.height + (first ? 0 : 6);
    if (y + Math.max(need, first ? 160 : 0) > PH - MG - 14) { pages.push([]); await head(true); }
    if (retenir) {
      const h = Math.max(56, body.height + 20);
      p().push(RC({ left: MG, top: y, width: W, height: h, rx: 8, ry: 8 }));
      const g = await svgObj('bouclier', 36); g.set({ left: MG + 12, top: y + (h - 36) / 2 }); p().push(g);
      body.set({ top: y + 10 }); p().push(body); y += h + 10; continue;
    }
    p().push(RC({ left: MG, top: y, width: bw, height: 24, fill: parole ? '#2563EB' : (/DANGER|ALERTE|RISQUE/.test(s.t) ? '#D7263D' : '#1B2A41') }), TX(s.t, { left: MG + 10, top: y + 5, width: bw - 20, fontFamily: 'Oswald', fontSize: 13, fontWeight: '700', fill: '#FFFFFF' }));
    body.set({ top: y + 30 }); p().push(body);
    if (first) {
      p().push(RC({ left: MG + W - 220, top: y, width: 220, height: 160, fill: '#CBD5E1', name: 'Emplacement photo' }), TX('Votre photo ici · Photos > Importer', { left: MG + W - 210, top: y + 72, width: 200, textAlign: 'center', fontSize: 10.5, fontWeight: '600', fill: '#475569' }));
      y += Math.max(168, 30 + body.height + 10);
    } else y += 30 + body.height + 12;
  }
  ST.lock = true;
  for (let i = 0; i < pages.length; i++) {
    ST.c.clear(); ST.c.setBackgroundColor('#FFFFFF', () => {});
    pages[i].forEach(o => ST.c.add(o));
    ST.c.add(TX((S.cfg.NOM_ENTREPRISE || '') + ' · Quart d’heure sécurité', { left: MG, top: PH - MG + 4, width: W, fontSize: 7.5, fill: '#6B7280', textAlign: 'center' }));
    ST.pages[i] = ST.c.toJSON(XPROPS);

  ST.dirty = true; setStat('Modèle mis en page : vérifiez puis enregistrez');

/* ─── Import de fichiers dans le studio ─── */
async function importToStudio(files) {
  loading(true);
  try {
    for (const f of Array.from(files)) {
      if (f.type === 'application/pdf') {
        const lib = await loadPdfJs();
        const pdf = await lib.getDocument({ data: await f.arrayBuffer() }).promise;
        for (let n = 1; n <= Math.min(6, pdf.numPages); n++) {
          const pg = await pdf.getPage(n), v1 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 1400 / v1.width });
          const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
          await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
          await addBackgroundPage(cv.toDataURL('image/jpeg', 0.85));
        }
      } else {
        const d = await fileToDataURL(f, 1600, f.type === 'image/png');
        const img = await imgFromURL(d);
        const pageLike = Math.abs(img.width / img.height - PW / PH) < 0.08;
        if (pageLike && files.length > 1) await addBackgroundPage(d);
        else if (pageLike) { img.set({ scaleX: PW / img.width, scaleY: PH / img.height, left: 0, top: 0, name: 'Affiche importée' }); addObj(img, true); ST.c.sendToBack(img); }
        else { img.scaleToWidth(Math.min(300, img.width)); img.set({ name: 'Photo' }); addObj(img); }
      }
    }
    toast('Import terminé : vous pouvez ajouter textes et blocs par-dessus.', 'ok');
  } catch (e) { toast('Import impossible : ' + (e.message || e), 'err'); }
  loading(false);
}
async function addBackgroundPage(dataUrl) {
  const empty = ST.c.getObjects().filter(o => o.name !== '__guide' && o.name !== 'Cadre de chantier').length === 0;
  if (!empty) { savePage(); ST.pages.splice(ST.cur + 1, 0, null); ST.thumbs.splice(ST.cur + 1, 0, ''); await loadPage(ST.cur + 1); }
  else ST.c.getObjects().slice().forEach(o => ST.c.remove(o));
  const img = await imgFromURL(dataUrl);
  img.set({ left: 0, top: 0, scaleX: PW / img.width, scaleY: PH / img.height, name: 'Affiche importée' });
  ST.c.add(img); ST.c.sendToBack(img); ST.c.requestRenderAll();
  ST.dirty = true;
}

/* ═════════════ Rapidité, enregistrement rapide, secours en cas de panne, essentiels intégrés ═════════════ */
/* Petit stockage local robuste (IndexedDB : bien plus de place que localStorage) */
const IDB = {
  db: null,
  /* IndexedDB peut être bloqué dans la page Google (navigateur, mode privé…) : on n’attend jamais plus de 1,5 s. */
  t(p, d) { return Promise.race([p, new Promise(ok => setTimeout(() => ok(d), 1500))]); },
  open() { if (!this.db) this.db = this.t(new Promise(ok => { try { const r = indexedDB.open('q15', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); r.onblocked = () => ok(null); } catch (e) { ok(null); } }), null); return this.db; },
  async get(k) { try { const db = await this.open(); if (!db) return null; return await this.t(new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); }), null); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); if (!db) return; await this.t(new Promise(ok => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }), null); } catch (e) { /* */ } },
  async del(k) { try { const db = await this.open(); if (db) db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) { /* */ } }
};

/* 2. Enregistrement rapide : seules les pages modifiées sont recalculées, sans bloquer l’écran */
function zh(j) { const s = typeof j === 'string' ? j : JSON.stringify(j || ''); let h = 0; for (let i = 0; i < s.length; i += 7) h = (h * 31 + s.charCodeAt(i)) | 0; return h + ':' + s.length; }
async function renderChanged() {
  savePage();
  const out = [], el = document.createElement('canvas'), changed = [];
  const sc = new fabric.StaticCanvas(el, { width: PW, height: PH, backgroundColor: '#FFFFFF' });
  const sameCount = ST.savedCount === ST.pages.length;
  for (let i = 0; i < ST.pages.length; i++) {
    const j = ST.pages[i], h = zh(j);
    if (sameCount && ST.saved && ST.saved[i] === h && ST.hasFiles) { out.push(null); continue; }
    await new Promise(ok => { if (!j) { sc.clear(); sc.setBackgroundColor('#FFFFFF', () => {}); sc.renderAll(); return ok(); } sc.loadFromJSON(j, () => { sc.renderAll(); ok(); }); });
    out.push(sc.toDataURL({ format: 'jpeg', quality: 0.85, multiplier: 2 })); changed.push([i, h]);
  }
  sc.dispose();
  return { pages: out, changed: changed };
}

  ST.saving = (async () => {

      r.changed.forEach(c => { ST.saved[c[0]] = c[1]; }); ST.savedCount = ST.pages.length; ST.hasFiles = true;
      ST.dirty = false; IDB.del('auto_' + ST.id); try { localStorage.removeItem('q15_auto_' + ST.id); } catch (e) { /* */ }

function kType(i, k) {
  const q = S.ed.quiz[i];
  if (k === 'QCM1' || k === 'QCMN') {
    const was = q.type === 'QCM'; q.type = 'QCM';
    if (!was) { q.o = ['', '', '', '']; q.r = 0; }
    if (k === 'QCMN') { q.multi = true; q.r = Array.isArray(q.r) ? q.r : [Number(q.r) || 0]; } else { q.multi = false; q.r = Array.isArray(q.r) ? (q.r[0] || 0) : Number(q.r) || 0; }
  }
  if (k === 'VF') { q.type = 'VF'; q.r = 'VRAI'; q.o = []; q.multi = false; }
  if (k === 'ORDRE') { q.type = 'ORDRE'; q.r = null; q.o = ['Étape 1', 'Étape 2', 'Étape 3']; q.multi = false; }
  drawKeds();
}
function kGood(i, j, on) {
  const q = S.ed.quiz[i];
  if (!q.multi) q.r = j; else { const r = (Array.isArray(q.r) ? q.r : []).filter(x => x !== j); if (on) r.push(j); q.r = r.sort(); }
  drawKeds();
}
function kDelO(i, j) {
  const q = S.ed.quiz[i]; q.o.splice(j, 1);
  if (q.multi) q.r = (q.r || []).filter(x => x !== j).map(x => x > j ? x - 1 : x); else { if (Number(q.r) === j) q.r = 0; else if (q.r > j) q.r--; }
  drawKeds();
}
function kDup(i) { S.ed.quiz.splice(i + 1, 0, JSON.parse(JSON.stringify(Object.assign({}, S.ed.quiz[i], { id: '' })))); drawKeds(); }
kAdd = function () { S.ed.quiz.push(qNew()); drawKeds(); setTimeout(() => { const s = document.querySelectorAll('.qed'); if (s.length) s[s.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 30); };
cleanQuiz = function () {
  return S.ed.quiz.map(q => {
    const o = (q.o || []).map(s => String(s || '').trim());
    if (q.type === 'QCM') {
      const keep = o.map((t, k) => ({ t: t, k: k })).filter(x => x.t), idx = k => keep.findIndex(x => x.k === k);
      const r = q.multi ? (Array.isArray(q.r) ? q.r : [q.r]).map(Number).map(idx).filter(x => x >= 0) : Math.max(0, idx(Number(q.r)));
      return Object.assign({}, q, { o: keep.map(x => x.t), r: r });
    }
    return Object.assign({}, q, { o: o.filter(Boolean) });
  });
};

/* ═════════════ Quiz côté compagnon : présentation identique à la maquette ═════════════ */
function qImgSrc(id) { return (LIB && LIB.cache && LIB.cache[id] && LIB.cache[id].length < 400000) ? LIB.cache[id] : 'https://drive.google.com/thumbnail?id=' + id + '&sz=w800'; }
runKahoot = function (el, quiz, opts) {
  const base = Number(S.cfg.TEMPS_QUESTION_SEC) || 20, st = { i: 0, score: 0, ok: 0, streak: 0, wrong: [] };
  let tick = null, t0 = 0, limit = 0, locked = false, sel = [];
  const stop = () => { if (tick) { clearInterval(tick); tick = null; } };
  const mmss = s => '00:' + String(Math.max(0, Math.ceil(s))).padStart(2, '0');
  function draw() {
    locked = false; sel = [];
    const q = quiz[st.i]; limit = (q.t || base) * (opts.team ? 1.5 : 1);
    const multi = q.type === 'QCM' && (q.multi || Array.isArray(q.r));
    el.innerHTML = '<div class="k15"><div class="k15-top"><div class="k15-prog"><i style="width:' + Math.round(100 * (st.i + 1) / quiz.length) + '%"></i></div><span>' + (st.i + 1) + '/' + quiz.length + '</span></div>' +
      '<div class="k15-time"><span id="kc">⏱ ' + mmss(limit) + '</span>' + (st.streak >= 2 ? '<b>🔥 x' + st.streak + '</b>' : '') + '</div>' +
      (q.img ? '<div class="k15-img"><img src="' + qImgSrc(q.img) + '" alt=""></div>' : '') +
      '<div class="k15-card">' + (q.bonus ? '<div class="k15-bonus">⭐ Question bonus (+200)</div>' : '') + '<h2>' + esc(q.q) + '</h2>' + (multi ? '<p class="k15-hint">Plusieurs bonnes réponses possibles</p>' : '') + '<div id="kb"></div><div id="kf"></div></div></div>';
    const b = el.querySelector('#kb');
    if (q.type === 'QCM' || q.type === 'VF') {
      const opts2 = q.type === 'VF' ? [['VRAI', 'Vrai'], ['FAUX', 'Faux']] : q.o.map((t, k) => [k, t]);
      b.innerHTML = opts2.map((o, k) => '<button class="k15-opt" data-v="' + o[0] + '"><span class="l">' + LET[k] + '</span><span class="t">' + esc(o[1]) + '</span></button>').join('') + (multi ? '<button class="k15-go" id="kval" disabled>Valider mes réponses</button>' : '');
      b.querySelectorAll('.k15-opt').forEach(x => x.onclick = () => {
        if (locked) return;
        const v = q.type === 'VF' ? x.dataset.v : Number(x.dataset.v);
        if (!multi) { x.classList.add('sel'); return answer(v); }
        const p = sel.indexOf(v); if (p >= 0) sel.splice(p, 1); else sel.push(v);
        x.classList.toggle('sel', p < 0); b.querySelector('#kval').disabled = !sel.length;
      });
      if (multi) b.querySelector('#kval').onclick = () => answer(sel.slice().sort());
    } else {
      const mix = shuffle(q.o.map((t, k) => ({ t: t, k: k }))); if (mix.every((m, k) => m.k === k)) mix.reverse();
      const chosen = [];
      const drawO = () => {
        b.innerHTML = '<p class="k15-hint">Touchez les étapes dans le bon ordre</p>' + chosen.map((m, k) => '<button class="k15-opt sel" data-c="' + k + '"><span class="l">' + (k + 1) + '</span><span class="t">' + esc(m.t) + '</span></button>').join('') +
          mix.filter(m => chosen.indexOf(m) < 0).map(m => '<button class="k15-opt" data-p="' + m.k + '"><span class="l">•</span><span class="t">' + esc(m.t) + '</span></button>').join('') +
          '<button class="k15-go" id="ordok"' + (chosen.length < q.o.length ? ' disabled' : '') + '>Valider</button>';
        b.querySelectorAll('[data-p]').forEach(x => x.onclick = () => { if (!locked) { chosen.push(mix.find(m => m.k === Number(x.dataset.p))); drawO(); } });
        b.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { if (!locked) { chosen.splice(Number(x.dataset.c), 1); drawO(); } });
        b.querySelector('#ordok').onclick = () => answer(chosen.map(m => m.k));
      };
      drawO();
    }
    t0 = Date.now(); stop();
    tick = setInterval(() => {
      const left = limit - (Date.now() - t0) / 1000, c = el.querySelector('#kc');
      if (c) { c.textContent = '⏱ ' + mmss(left); c.classList.toggle('hot', left <= 5); }
      if (left <= 0) { stop(); answer(multi ? sel.slice().sort() : null); }
    }, 250);
    S.timers.push(tick);
  }
  function localOk(q, a) {
    if (a === null || a === undefined) return false;
    if (q.type === 'VF') return String(a) === q.r;
    if (q.type === 'QCM' && Array.isArray(q.r)) { const x = (Array.isArray(a) ? a : [a]).map(Number).sort(); return x.length === q.r.length && x.every((v, i) => v === Number(q.r[i])); }
    if (q.type === 'QCM') return Number(a) === Number(q.r);
    return Array.isArray(a) && a.every((v, k) => v === k);
  }
  async function answer(a) {
    if (locked) return; locked = true; stop();
    const q = quiz[st.i], ms = Date.now() - t0;
    el.querySelectorAll('.k15-opt,.k15-go').forEach(x => { x.disabled = true; });
    let res = null;
    try { res = opts.preview ? null : await call('player.answer', { joueurId: S.g.j.joueurId, tok: S.g.j.tok, qid: q.id, answer: a, ms: ms }, { silent: true, quiet: true }); } catch (e) { res = null; }
    const ok = res ? res.ok : localOk(q, a), pts = res ? res.points : (ok ? Math.round(500 + 500 * (1 - ms / (limit * 1000))) : 0);
    st.score = res ? res.score : st.score + pts;
    if (ok) { st.ok++; st.streak++; } else { st.streak = 0; st.wrong.push(q); try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) { /* */ } }
    const sc = document.getElementById('kscore'); if (sc) sc.textContent = '⭐ ' + st.score;
    const good = q.type === 'VF' ? [q.r] : q.type === 'QCM' ? (Array.isArray(q.r) ? q.r.map(Number) : [Number(q.r)]) : [];
    if (q.type !== 'ORDRE') el.querySelectorAll('.k15-opt').forEach(x => { const v = q.type === 'VF' ? x.dataset.v : Number(x.dataset.v); x.classList.add(good.indexOf(v) >= 0 ? 'right' : x.classList.contains('sel') ? 'wrong' : 'dim'); });
    else el.querySelector('#kb').innerHTML = '<p class="k15-hint">Le bon ordre :</p>' + q.o.map((t, k) => '<div class="k15-opt right"><span class="l">' + (k + 1) + '</span><span class="t">' + esc(t) + '</span></div>').join('');
    const last = st.i === quiz.length - 1;
    el.querySelector('#kf').innerHTML = '<div class="k15-res ' + (ok ? 'ok' : 'ko') + '">' + (ok ? 'Bonne réponse ! <b>+' + pts + ' pts</b>' : a === null ? '⏰ Temps écoulé' : 'Pas tout à fait…') + '</div>' +
      (q.e ? '<div class="k15-tip"><span>💡</span><div><b>Le bon réflexe :</b><br>' + esc(q.e) + '</div></div>' : '') +
      '<button class="k15-go" id="knext">' + (last ? 'Voir le classement 🏆' : 'Question suivante →') + '</button>';
    el.querySelector('#knext').onclick = () => { if (last) opts.onDone(st); else { st.i++; draw(); window.scrollTo(0, 0); } };
    if (ok && st.streak >= 3) confetti();
  }
  draw();
};

/* ═══════════ FICHES DE FORMATION ═══════════ */
function inl(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>'); }

function parseContent(txt) {
  const lines = String(txt || '').replace(/\r/g, '').split('\n');
  const cards = [];
  let cur = null, list = null;
  const flush = () => { if (list) { cur.body += '<ul>' + list.join('') + '</ul>'; list = null; } };
  const ensure = () => { if (!cur) { cur = { title: '', body: '' }; cards.push(cur); } };
  const BOX = { '!!': ['danger', '⚠️ Danger'], '>>': ['good', '✅ Bon réflexe'], 'ii': ['info', '💡 Le saviez-vous ?'], '??': ['talk', '💬 À vous la parole'] };
  lines.forEach(raw => {
    const l = raw.trim();
    if (!l) { if (cur) flush(); return; }
    if (l.indexOf('# ') === 0) { if (cur) flush(); cur = { title: l.slice(2), body: '' }; cards.push(cur); return; }
    ensure();
    if (l.indexOf('- ') === 0) { (list = list || []).push('<li>' + inl(l.slice(2)) + '</li>'); return; }
    flush();
    if (l.indexOf('## ') === 0) {
      const parts = l.slice(3).split('|');
      cur.body += '<div class="statbig"><div class="n">' + inl(parts[0].trim()) + '</div><div class="t">' + inl((parts.slice(1).join('|')).trim()) + '</div></div>';
      return;
    }
    const k = l.slice(0, 2);
    if (BOX[k] && l.charAt(2) === ' ') { cur.body += '<div class="box ' + BOX[k][0] + '"><div class="box-h">' + BOX[k][1] + '</div>' + inl(l.slice(3)) + '</div>'; return; }
    if (l.indexOf('[ok] ') === 0) { cur.body += '<div class="do ok"><span>✔</span><div>' + inl(l.slice(5)) + '</div></div>'; return; }
    if (l.indexOf('[ko] ') === 0) { cur.body += '<div class="do ko"><span>✘</span><div>' + inl(l.slice(5)) + '</div></div>'; return; }
    cur.body += '<p>' + inl(l) + '</p>';
  });
  if (cur) flush();
  return cards.map(c => ({ title: c.title, html: (c.title ? '<h2>' + inl(c.title) + '</h2>' : '') + c.body }));
}

function mountReader(el, contenu, opts) {
  opts = opts || {};
  const cards = parseContent(contenu);
  if (!cards.length) cards.push({ html: '<p>Contenu vide.</p>' });
  let i = 0;
  const go = d => { const n = i + d; if (n >= 0 && n < cards.length) { i = n; draw(); el.scrollIntoView({ block: 'start' }); } };
  function draw() {
    const last = i === cards.length - 1;
    el.innerHTML = '<div class="reader' + (opts.present ? ' present' : '') + '">' +
      '<div class="rprog">' + cards.map((c, k) => '<span class="' + (k <= i ? 'on' : '') + '"></span>').join('') + '</div>' +
      '<div class="rcard anim">' + cards[i].html + '</div>' +
      '<div class="rnav"><button class="btn ghost" data-r="p"' + (i === 0 ? ' disabled' : '') + '>◀ Retour</button><span class="cnt">' + (i + 1) + '/' + cards.length + '</span>' +
      '<button class="btn ' + (last ? 'green' : 'primary') + '" data-r="n">' + (last ? (opts.doneLabel || 'J’ai compris ✓') : 'Suivant ▶') + '</button></div></div>';
    el.querySelector('[data-r=p]').onclick = () => go(-1);
    el.querySelector('[data-r=n]').onclick = () => { if (!last) go(1); else if (opts.onDone) opts.onDone(); };
  }
  let x0 = null;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 70) go(dx < 0 ? 1 : -1); }, { passive: true });
  S.keyHandler = e => { if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1); };
  draw();
}

/* ═══════════ SIGNATURE ═══════════ */
function mountSig(wrap) {
  wrap.innerHTML = '<canvas></canvas><div class="hint">✍️ Signez ici avec le doigt ou la souris</div><button class="btn sm ghost clr" type="button">Effacer</button>';
  const cv = wrap.querySelector('canvas'), hint = wrap.querySelector('.hint'), ctx = cv.getContext('2d');
  let dr = false, last = null, dirty = false;
  const r0 = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r0.width * dpr); cv.height = Math.round(r0.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1a33'; ctx.fillStyle = '#0b1a33';
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (r0.width / r.width), y: (e.clientY - r.top) * (r0.height / r.height) }; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); dr = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* */ } hint.style.display = 'none'; ctx.beginPath(); ctx.arc(last.x, last.y, 1.3, 0, Math.PI * 2); ctx.fill(); dirty = true; });
  cv.addEventListener('pointermove', e => { if (!dr) return; e.preventDefault(); const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => { dr = false; }));
  wrap.querySelector('.clr').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; hint.style.display = ''; };
  return {
    isEmpty: () => !dirty,
    data() {
      const o = document.createElement('canvas'); o.width = 360; o.height = 140;
      const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, 360, 140); c.drawImage(cv, 0, 0, 360, 140);
      let d = o.toDataURL('image/png');
      if (d.length > 45000) d = o.toDataURL('image/jpeg', 0.6);
      return d;
    }
  };
}

const NO_BOOT = /^(admin\.boot|design\.(save|autosave|auto|load|pdf)|lib\.|assets\.|quiz\.img|mail\.test|pub\.|join|player\.)/;

  opts = opts || {};

  const wantBoot = !!S.key && !NO_BOOT.test(action);
  const t0 = Date.now();
  return new Promise((resolve, reject) => {
    let done = false;
    const guard = setTimeout(() => { if (done) return; done = true; if (!opts.silent) loading(false); if (!opts.quiet) toast('Le serveur met trop de temps à répondre. Réessayez.', 'err'); reject(new Error('DELAI')); }, opts.timeout || 180000);
    const fin = () => { done = true; clearTimeout(guard); if (!opts.silent) loading(false); };
    google.script.run
      .withSuccessHandler(raw => {
        if (done) return; fin();
        let r; try { r = JSON.parse(raw); } catch (e) { r = { ok: false, error: 'Réponse illisible.' }; }

        if (!opts.quiet) toast(r.error, 'err');

        if (done) return; fin();
        if (!opts.quiet) toast('Connexion impossible : ' + ((err && err.message) || err), 'err');

      })

const BULB = '<svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true"><defs><radialGradient id="bg16" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6B0"/><stop offset=".55" stop-color="#FFD43B"/><stop offset="1" stop-color="#F59F00"/></radialGradient></defs>' +
  '<g stroke="#FFC107" stroke-width="2.4" stroke-linecap="round"><path d="M24 2v4M8.5 8.5l2.8 2.8M39.5 8.5l-2.8 2.8M3 23h4M41 23h4"/></g>' +
  '<path d="M24 9a13 13 0 0 0-7.5 23.6c1.4 1 2.2 2.4 2.2 4V38h10.6v-1.4c0-1.6.8-3 2.2-4A13 13 0 0 0 24 9z" fill="url(#bg16)"/>' +
  '<rect x="18.5" y="38.5" width="11" height="3.4" rx="1.4" fill="#7C8AA5"/><rect x="19.5" y="42.5" width="9" height="3" rx="1.4" fill="#5B6B88"/></svg>';
const DASH = '<div class="p16-dash" aria-hidden="true">' + Array.from({ length: 14 }, (_, i) => '<i style="left:' + (4 + (i * 37) % 92) + '%;top:' + (3 + (i * 23) % 60) + '%;transform:rotate(' + (i * 47 % 180) + 'deg);background:' + ['#FFD43B', '#C6EF2E', '#FFFFFF', '#F7931E'][i % 4] + '"></i>').join('') + '</div>';
function bar16(icon, label, right) { return '<div class="p16-bar"><span class="p16-bl">' + pi(icon, 24) + '<b>' + label + '</b></span>' + (right || '') + '</div>'; }
function shell16(html, cls) { document.body.classList.add('q15'); document.body.classList.remove('pro'); render('<div class="p16 ' + (cls || '') + '">' + html + '</div>'); }
function teamPhoto() { return '<img src="' + A15('15') + '" alt="">'; }

/* Accueil après le code */
joinGo = async function () {
  const code = val('code');
  if (code.length !== 6) return toast('Le code fait 6 chiffres.', 'warn');
  try {
    const more = assetsMore().catch(() => {});
    const d = await call('join', { code: code });
    await Promise.race([more, new Promise(ok => setTimeout(ok, 6000))]);
    S.g = { d: d, code: code, pg: 0 };
    const saved = JSON.parse(LS.get('qhs_j_' + d.campagne.id) || 'null');
    if (saved && saved.joueurId) { S.g.j = saved; return viewResume(); }
    viewWelcome();
  } catch (e) { /* message affiché */ }
};
function viewWelcome() {
  const d = S.g.d;
  shell16('<div class="p16-head"><img src="' + A15('01') + '" alt="15’ Sécurité"><span>Apprendre. Réagir.<br>Protéger.</span></div>' +
    '<div class="p16-hero"><img class="p16-man" src="' + A15('03') + '" alt="">' +
    '<div class="p16-slab"><h1>Le quart d’heure<br>sécurité est lancé !</h1><p>Cette causerie dure environ<br>' + (Number(S.cfg.DUREE_CIBLE_MIN) || 15) + ' minutes.</p></div>' +
    '<div class="p16-theme">' + esc(d.contenu.titre) + '</div>' +
    '<button class="p16-lime p16-start" onclick="S.g.pg=0;viewRead()">Commencer ' + pi('arrow', 26) + '</button></div>', 'p16-welcome');
}
viewResume = function () {
  shell16(bar16('user', 'Reprendre') + '<div class="p16-pad"><div class="p16-card c"><h2 class="p16-h">Rebonjour ' + esc(S.g.j.pseudo) + ' !</h2><p class="p16-mut">Vous avez déjà commencé cette causerie sur cet appareil.</p>' +
    '<button class="p16-lime" onclick="' + (S.g.j.finished ? 'viewSign()' : 'viewQuiz()') + '">Reprendre ' + pi('arrow', 22) + '</button><button class="p16-ghost" onclick="newPlayer()">Nouveau joueur / nouvelle équipe</button></div></div>');
};
newPlayer = function () { LS.del('qhs_j_' + S.g.d.campagne.id); S.g.j = null; S.g.pg = 0; viewWelcome(); };

/* Causerie page par page */
viewRead = function () {
  const c = S.g.d.contenu, pages = c.fichiers || [], n = Math.max(1, pages.length), i = Math.min(S.g.pg || 0, n - 1), last = i >= n - 1;
  if (c.source === 'FICHES') {
    shell16(bar16('book', 'Causerie') + '<div id="rd" class="p16-pad"></div>');
    return mountReader(document.getElementById('rd'), c.fiches, { doneLabel: 'Passer au quiz', onDone: viewMode });
  }
  shell16(bar16('book', 'Causerie • ' + (i + 1) + ' / ' + n, '<span class="p16-prog"><i style="width:' + Math.round(100 * (i + 1) / n) + '%"></i></span>') +
    '<div class="p16-page">' + (pages[i] ? '<img src="' + driveImg(pages[i]) + '" alt="Page ' + (i + 1) + '">' : '<p class="p16-mut" style="padding:40px">Page indisponible.</p>') + '</div>' +
    '<div class="p16-foot">' + (i > 0 ? '<button class="p16-back" onclick="S.g.pg--;viewRead()" aria-label="Page précédente">‹</button>' : '') +
    '<button class="p16-navy" onclick="' + (last ? 'viewMode()' : 'S.g.pg++;viewRead()') + '">' + (last ? 'Passer au quiz' : 'Continuer') + ' ' + pi('arrow', 22) + '</button></div>', 'p16-read');
  if (pages[i + 1]) { const im = new Image(); im.src = driveImg(pages[i + 1]); }
};

/* Choix du mode de jeu */
viewMode = function () {
  const d = S.g.d, nq = (d.quiz || []).length;
  shell16(bar16('quiz', 'Quiz • ' + nq + ' question' + (nq > 1 ? 's' : ''), '<span class="p16-timer">' + pi('clock', 26) + '00:' + String(Number(S.cfg.TEMPS_QUESTION_SEC) || 20).padStart(2, '0') + '</span>') +
    '<div class="p16-pad p16-light"><h2 class="p16-h c">Choisissez votre mode de jeu</h2><div class="p16-modes">' +
    '<div class="p16-mode" data-mode="EQUIPE" onclick="pickMode(\'EQUIPE\')"><span class="p16-ok">' + pi('check', 22) + '</span><div class="p16-mi">' + pi('team', 54, '#0E1B33') + '</div><h3>Par équipe</h3><p>En équipe, soyez<br>plus forts !</p><div class="p16-ph">' + teamPhoto() + '</div>' +
    '<label>Nom de l’équipe</label><div class="p16-in">' + pi('team', 20, '#0E1B33') + '<input id="pteam" maxlength="24" placeholder="Les Experts"></div></div>' +
    '<div class="p16-mode" data-mode="SOLO" onclick="pickMode(\'SOLO\')"><span class="p16-ok">' + pi('check', 22) + '</span><div class="p16-mi">' + pi('user', 50, '#0E1B33') + '</div><h3>Individuel</h3><p>Testez vos<br>connaissances !</p><div class="p16-ph solo"><img src="' + A15('03') + '" alt=""></div>' +
    '<label>Votre pseudo</label><div class="p16-in">' + pi('user', 20, '#0E1B33') + '<input id="psolo" maxlength="24" placeholder="Julien87"></div></div></div>' +
    (d.equipes && d.equipes.length ? '<label class="p16-lab" for="equipe">Votre chantier</label><select id="equipe" class="p16-sel"><option value="">—</option>' + d.equipes.map(e => '<option>' + esc(e) + '</option>').join('') + '</select>' : '<input type="hidden" id="equipe" value="">') +
    '<button class="p16-lime" onclick="startGame()">C’est parti ! ' + pi('arrow', 22) + '</button></div>', 'p16-modepg');
  pickMode('SOLO');
};
pickMode = function (m) {
  S.g.mode = m;
  document.querySelectorAll('[data-mode]').forEach(e => e.classList.toggle('sel', e.dataset.mode === m));
  const i = document.getElementById(m === 'EQUIPE' ? 'pteam' : 'psolo'); if (i && document.activeElement !== i) setTimeout(() => i.focus(), 30);
};
startGame = async function () {
  const pseudo = val(S.g.mode === 'EQUIPE' ? 'pteam' : 'psolo').trim();
  if (!pseudo) return toast(S.g.mode === 'EQUIPE' ? 'Donnez un nom à l’équipe.' : 'Choisissez un pseudo.', 'warn');
  try {
    const r = await call('player.start', { code: S.g.code, pseudo: pseudo, mode: S.g.mode, equipe: val('equipe') });
    S.g.j = { joueurId: r.joueurId, tok: r.tok, pseudo: r.pseudo, mode: S.g.mode, equipe: val('equipe'), done: {} };
    LS.set('qhs_j_' + S.g.d.campagne.id, JSON.stringify(S.g.j));
    viewQuiz();
  } catch (e) { /* */ }
};
viewQuiz = function () {
  shell16('<div id="kz"></div>', 'p16-quiz');
  runKahoot(document.getElementById('kz'), S.g.d.quiz, { team: S.g.j.mode === 'EQUIPE', onDone: viewEnd });
};

/* Moteur de quiz : présentation des maquettes */
runKahoot = function (el, quiz, opts) {
  const base = Number(S.cfg.TEMPS_QUESTION_SEC) || 20, st = { i: 0, score: 0, ok: 0, streak: 0, wrong: [] };
  let tick = null, t0 = 0, limit = 0, locked = false, sel = [];
  const stop = () => { if (tick) { clearInterval(tick); tick = null; } };
  const mmss = s => '00:' + String(Math.max(0, Math.ceil(s))).padStart(2, '0');
  const COL = ['a', 'b', 'c', 'd', 'e', 'f'];
  function head() { return bar16('quiz', 'Quiz • Question ' + (st.i + 1) + ' / ' + quiz.length, '<span class="p16-timer" id="kc">' + pi('clock', 26) + mmss(limit) + '</span>'); }
  function draw() {
    locked = false; sel = [];
    const q = quiz[st.i]; limit = (q.t || base) * (opts.team ? 1.5 : 1);
    const multi = q.type === 'QCM' && (q.multi || Array.isArray(q.r));
    el.innerHTML = '<div class="p16-q">' + head() + DASH +
      (q.img ? '<div class="p16-qimg"><img src="' + qImgSrc(q.img) + '" alt=""></div>' : '') +
      (q.bonus ? '<div class="p16-bonus">Question bonus</div>' : '') +
      '<h2 class="p16-qt">' + esc(q.q) + '</h2>' + (multi ? '<p class="p16-hint">Plusieurs bonnes réponses possibles</p>' : '') +
      '<div id="kb" class="p16-opts"></div>' +
      '<div class="p16-qfoot"><span class="p16-pts">' + pi('bolt', 30, '#FFD43B') + '<b id="kscore">' + st.score + ' pts</b></span><span class="p16-cup">' + pi('trophy', 30, '#FFD43B') + '</span></div></div>';
    const b = el.querySelector('#kb');
    if (q.type === 'QCM' || q.type === 'VF') {
      const o2 = q.type === 'VF' ? [['VRAI', 'Vrai'], ['FAUX', 'Faux']] : q.o.map((t, k) => [k, t]);
      b.innerHTML = o2.map((o, k) => '<button class="p16-opt ' + COL[k] + '" data-v="' + o[0] + '"><span class="l">' + LET[k] + '</span><span class="t">' + esc(o[1]) + '</span></button>').join('') +
        (multi ? '<button class="p16-lime p16-val" id="kval" disabled>Valider mes réponses</button>' : '');
      b.querySelectorAll('.p16-opt').forEach(x => x.onclick = () => {
        if (locked) return;
        const v = q.type === 'VF' ? x.dataset.v : Number(x.dataset.v);
        if (!multi) { x.classList.add('sel'); return answer(v); }
        const p = sel.indexOf(v); if (p >= 0) sel.splice(p, 1); else sel.push(v);
        x.classList.toggle('sel', p < 0); b.querySelector('#kval').disabled = !sel.length;
      });
      if (multi) b.querySelector('#kval').onclick = () => answer(sel.slice().sort());
    } else {
      b.classList.add('ord');
      const mix = shuffle(q.o.map((t, k) => ({ t: t, k: k }))); if (mix.every((m, k) => m.k === k)) mix.reverse();
      const chosen = [];
      const drawO = () => {
        b.innerHTML = '<p class="p16-hint">Touchez les étapes dans le bon ordre</p>' + chosen.map((m, k) => '<button class="p16-opt b" data-c="' + k + '"><span class="l">' + (k + 1) + '</span><span class="t">' + esc(m.t) + '</span></button>').join('') +
          mix.filter(m => chosen.indexOf(m) < 0).map((m, k) => '<button class="p16-opt ' + COL[k % 4] + '" data-p="' + m.k + '"><span class="l">•</span><span class="t">' + esc(m.t) + '</span></button>').join('') +
          '<button class="p16-lime p16-val" id="ordok"' + (chosen.length < q.o.length ? ' disabled' : '') + '>Valider</button>';
        b.querySelectorAll('[data-p]').forEach(x => x.onclick = () => { if (!locked) { chosen.push(mix.find(m => m.k === Number(x.dataset.p))); drawO(); } });
        b.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { if (!locked) { chosen.splice(Number(x.dataset.c), 1); drawO(); } });
        b.querySelector('#ordok').onclick = () => answer(chosen.map(m => m.k));
      };
      drawO();
    }
    t0 = Date.now(); stop();
    tick = setInterval(() => {
      const left = limit - (Date.now() - t0) / 1000, c = el.querySelector('#kc');
      if (c) { c.lastChild.textContent = mmss(left); c.classList.toggle('hot', left <= 5); }
      if (left <= 0) { stop(); answer(multi ? sel.slice().sort() : null); }
    }, 250);
    S.timers.push(tick);
  }
  function localOk(q, a) {
    if (a === null || a === undefined) return false;
    if (q.type === 'VF') return String(a) === q.r;
    if (q.type === 'QCM' && Array.isArray(q.r)) { const x = (Array.isArray(a) ? a : [a]).map(Number).sort(); return x.length === q.r.length && x.every((v, i) => v === Number(q.r[i])); }
    if (q.type === 'QCM') return Number(a) === Number(q.r);
    return Array.isArray(a) && a.every((v, k) => v === k);
  }
  function goodText(q) {
    if (q.type === 'VF') return q.r === 'VRAI' ? 'Vrai' : 'Faux';
    if (q.type === 'ORDRE') return q.o.map((t, k) => (k + 1) + '. ' + t).join('<br>');
    const g = Array.isArray(q.r) ? q.r.map(Number) : [Number(q.r)];
    return g.map(k => LET[k] + ' — ' + esc(q.o[k])).join('<br>');
  }
  async function answer(a) {
    if (locked) return; locked = true; stop();
    const q = quiz[st.i], ms = Date.now() - t0;
    el.querySelectorAll('.p16-opt,.p16-val').forEach(x => { x.disabled = true; });
    let res = null;
    try { res = opts.preview ? null : await call('player.answer', { joueurId: S.g.j.joueurId, tok: S.g.j.tok, qid: q.id, answer: a, ms: ms }, { silent: true, quiet: true }); } catch (e) { res = null; }
    const ok = res ? res.ok : localOk(q, a), pts = res ? res.points : (ok ? Math.round(500 + 500 * (1 - ms / (limit * 1000))) : 0);
    st.score = res ? res.score : st.score + pts;
    if (ok) { st.ok++; st.streak++; } else { st.streak = 0; st.wrong.push(q); try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) { /* */ } }
    const last = st.i === quiz.length - 1;
    el.innerHTML = '<div class="p16-ans ' + (ok ? 'ok' : 'ko') + '">' + (ok ? DASH : '') +
      '<img class="p16-cupbig" src="' + A15(ok ? '05' : '04') + '" alt="">' +
      '<h2>' + (ok ? 'Bonne réponse !' : a === null ? 'Temps écoulé !' : 'Pas tout à fait…') + '</h2>' +
      '<div class="p16-gain">+ ' + (pts || 0) + ' pts</div>' +
      (!ok ? '<div class="p16-good"><b>La bonne réponse :</b><br>' + goodText(q) + '</div>' : '') +
      (q.e ? '<div class="p16-tip">' + BULB + '<div><b>Le bon réflexe :</b><br>' + esc(q.e) + '</div></div>' : '') +
      '<button class="p16-lime" id="knext">' + (last ? 'Voir les résultats' : 'Question suivante') + ' ' + pi('arrow', 22) + '</button>' +
      '<div class="p16-total">Total : <b>' + st.score + ' pts</b></div></div>';
    el.querySelector('#knext').onclick = () => { if (last) opts.onDone(st); else { st.i++; draw(); window.scrollTo(0, 0); } };
    if (ok && st.streak >= 3) confetti();
  }
  draw();
};

/* Résultats : Félicitations + podium */
viewEnd = async function (st) {
  let r = { rang: '?', total: '?', top: [] };
  try { r = await call('player.finish', { joueurId: S.g.j.joueurId, tok: S.g.j.tok }); } catch (e) { /* */ }
  S.g.j.finished = true; LS.set('qhs_j_' + S.g.d.campagne.id, JSON.stringify(S.g.j));
  confetti();
  const t = r.top || [], blk = (k, cls) => t[k] ? '<div class="p16-pod ' + cls + '"><span class="n">' + (k + 1) + '</span><b>' + esc(t[k].pseudo) + '</b><small>' + t[k].score + ' pts</small></div>' : '<div class="p16-pod ' + cls + ' empty"><span class="n">' + (k + 1) + '</span></div>';
  shell16(bar16('trophy', 'Résultats du quiz', '<span class="p16-chk">' + pi('check', 18) + '</span>') +
    '<div class="p16-end">' + DASH + '<h1 class="p16-fel">Félicitations !</h1><img class="p16-crowd" src="' + A15('15') + '" alt="">' +
    '<div class="p16-pods">' + blk(1, 's2') + blk(0, 's1') + blk(2, 's3') + '</div>' +
    '<div class="p16-me"><div><small>' + (S.g.j.mode === 'EQUIPE' ? 'Votre équipe' : 'Votre score') + '</small><b>' + esc(S.g.j.pseudo) + '</b></div><div class="r"><b>' + st.score + ' pts</b><small>' + st.ok + ' / ' + S.g.d.quiz.length + ' bonnes réponses · rang ' + r.rang + ' / ' + r.total + '</small></div></div>' +
    (st.wrong.length ? '<div class="p16-keep"><h3>À retenir</h3>' + st.wrong.map(q => '<div class="p16-tip sm">' + BULB + '<div><b>' + esc(q.q) + '</b>' + (q.e ? '<br>' + esc(q.e) : '') + '</div></div>').join('') + '</div>' : '') +
    '<button class="p16-lime" onclick="viewSign()">' + pi('pen', 22) + ' Signer la feuille d’émargement</button></div>', 'p16-endpg');
};

/* Émargement et fin */
viewSign = function () {
  const team = S.g.j.mode === 'EQUIPE';
  S.g.nSig = S.g.nSig || 0;
  shell16(bar16('pen', 'Émargement') + '<div class="p16-pad p16-light"><div class="p16-card"><h2 class="p16-h">' + esc(S.g.d.contenu.titre) + '</h2>' +
    (team ? '<p class="p16-mut">Équipe <b>' + esc(S.g.j.pseudo) + '</b> : chaque membre signe à tour de rôle sur cet appareil. Signatures enregistrées : <b>' + S.g.nSig + '</b></p>' : '') +
    '<label class="p16-lab" for="snom">Nom et prénom (votre vrai nom)</label><input id="snom" class="p16-sel" autocomplete="name">' +
    (team ? '' : '<label class="p16-lab" for="seq">Chantier / équipe</label><input id="seq" class="p16-sel" value="' + esc(S.g.j.equipe || '') + '">') +
    '<label class="p16-lab">Signature</label><div class="sigwrap" id="sig"></div>' +
    '<label class="p16-cert"><input type="checkbox" id="scert"> Je certifie avoir suivi le quart d’heure sécurité et compris les consignes.</label>' +
    '<button class="p16-lime" onclick="signGo()">Valider ma signature ' + pi('check', 22) + '</button>' +
    (team && S.g.nSig ? '<button class="p16-ghost" onclick="viewBye()">Tout le monde a signé : terminer</button>' : '') + '</div></div>');
  S.g.pad = mountSig(document.getElementById('sig'));
};
viewBye = function () {
  confetti();
  shell16('<div class="p16-end p16-bye">' + DASH + '<img class="p16-cupbig" src="' + A15('05') + '" alt=""><h1 class="p16-fel">Bravo à tous !</h1><p>Quart d’heure sécurité validé.<br>' +
    pick(['La sécurité, c’est l’affaire de tous. Bonne journée !', 'On repart en sécurité. Merci l’équipe !', 'Le meilleur chantier, c’est celui où tout le monde rentre entier.']) + '</p><img class="p16-masc" src="' + A15('04') + '" alt=""></div>');
};

</script>

</body>
